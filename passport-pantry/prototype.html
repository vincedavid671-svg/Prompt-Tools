<title>Passport Pantry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Archivo:wght@400;500;600;700&display=swap">
<style>
:root{
  --paper:#F6F5F1; --surface:#FFFFFF; --surface-2:#EDEBE3; --sunk:#E4E1D7;
  --ink:#1B211E; --ink-2:#4C554F; --ink-3:#7E877F;
  --line:#DBD7CC; --line-2:#C7C2B4;
  --accent:#B35A0E; --accent-ink:#8A450A; --accent-soft:#F4E5D3;
  --jade:#2E6B5E; --jade-soft:#DEEBE6;
  --chili:#9E2B20; --chili-soft:#F6E1DD; --on-accent:#FFFFFF;
  --display:'Fraunces',Georgia,'Times New Roman',serif;
  --body:'Archivo','Helvetica Neue',Arial,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#111614; --surface:#191F1C; --surface-2:#222A26; --sunk:#0D1210;
    --ink:#EDEAE0; --ink-2:#A6B0AA; --ink-3:#77817B;
    --line:#2C3531; --line-2:#3B4641;
    --accent:#E08B3C; --accent-ink:#F0AC6C; --accent-soft:#3A2915;
    --jade:#6FBFA8; --jade-soft:#1B322C;
    --chili:#E0786A; --chili-soft:#371F1B; --on-accent:#17120A;
  }
}
:root[data-theme="dark"]{
  --paper:#111614; --surface:#191F1C; --surface-2:#222A26; --sunk:#0D1210;
  --ink:#EDEAE0; --ink-2:#A6B0AA; --ink-3:#77817B;
  --line:#2C3531; --line-2:#3B4641;
  --accent:#E08B3C; --accent-ink:#F0AC6C; --accent-soft:#3A2915;
  --jade:#6FBFA8; --jade-soft:#1B322C;
  --chili:#E0786A; --chili-soft:#371F1B; --on-accent:#17120A;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--body); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.shell{display:flex;flex-direction:column;min-height:100%}
header.bar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  background:color-mix(in srgb,var(--paper) 92%,transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.bar-in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:9px;margin-right:auto}
.brand b{font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:-.01em}
.brand span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
nav.tabs{display:flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:999px}
nav.tabs button{
  border:0;background:transparent;border-radius:999px;padding:6px 14px;
  font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap;
}
nav.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.09)}
nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
main{flex:1;max-width:1080px;width:100%;margin:0 auto;padding-block:22px 64px;padding-left:16px;padding-right:16px}

/* ---------- generic ---------- */
.eyebrow{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.lede{color:var(--ink-2);max-width:62ch}
.rule{height:1px;background:var(--line);border:0;margin:22px 0}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.amber{background:var(--accent-soft);color:var(--accent-ink)}
.pill.jade{background:var(--jade-soft);color:var(--jade)}
.pill.chili{background:var(--chili-soft);color:var(--chili)}
.pill.plain{background:var(--surface-2);color:var(--ink-2)}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:8px 14px;font-size:13px;font-weight:600}
.btn:hover{border-color:var(--ink-3)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.notice{border:1px dashed var(--line-2);border-radius:var(--r);padding:11px 13px;font-size:12.5px;color:var(--ink-2);background:var(--surface)}

/* ---------- atlas ---------- */
.atlas-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:18px}
h1.title{font-family:var(--display);font-size:clamp(28px,5vw,40px);font-weight:600;letter-spacing:-.02em;line-height:1.08}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:12px}
.dish{
  text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);
  padding:14px 15px;display:flex;flex-direction:column;gap:7px;
}
.dish:hover{border-color:var(--ink-3)}
.dish .where{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-ink)}
.dish h3{font-family:var(--display);font-size:19px;font-weight:600;letter-spacing:-.01em}
.dish .native{font-size:12.5px;color:var(--ink-3);margin-top:-4px}
.dish p{margin:0;font-size:13px;color:var(--ink-2);line-height:1.45}
.dish .foot{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px}

/* ---------- recipe ---------- */
.back{border:0;background:transparent;padding:0;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:14px}
.back:hover{color:var(--accent-ink)}
.rhead{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start;justify-content:space-between}
.rmeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:26px;margin-top:22px}
@media (max-width:760px){.cols{grid-template-columns:1fr;gap:20px}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.panel + .panel{margin-top:12px}
.panel h2{font-family:var(--display);font-size:17px;font-weight:600;margin-bottom:2px}
.scaler{display:flex;align-items:center;gap:8px;margin:12px 0 4px}
.scaler button{width:28px;height:28px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface-2);font-weight:700;line-height:1}
.scaler .val{font-weight:700;min-width:74px;text-align:center;font-size:13px}
ul.ings{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column}
ul.ings li{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line)}
ul.ings li:first-child{border-top:0}
.qty{flex:0 0 96px;font-weight:600;font-size:13.5px}
.iname{flex:1;font-size:13.5px}
.iname em{font-style:normal;color:var(--ink-3);font-size:12px;display:block}
.stock{flex:0 0 auto;font-size:11px;font-weight:700}
.stock.ok{color:var(--jade)}
.stock.low{color:var(--accent-ink)}
.stock.none{color:var(--ink-3)}
ol.steps{margin:10px 0 0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:14px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:26px 1fr;gap:12px;font-size:14px;line-height:1.55}
ol.steps li::before{
  content:counter(s);font-family:var(--display);font-weight:600;font-size:13px;
  color:var(--accent-ink);background:var(--accent-soft);border-radius:50%;
  width:26px;height:26px;display:grid;place-items:center;
}
ol.steps b{display:block;font-weight:700;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.heat{font-size:12px;color:var(--ink-2);margin-top:3px}
.attrib{border-left:3px solid var(--line-2);padding:2px 0 2px 12px;font-size:12.5px;color:var(--ink-2)}

/* ---------- cooked / ratings ---------- */
.stars{display:flex;gap:3px}
.stars button{border:0;background:transparent;padding:2px;font-size:17px;line-height:1;color:var(--line-2)}
.stars button[data-on="1"]{color:var(--accent)}
.note{width:100%;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:8px 10px;font-size:13px;resize:vertical;min-height:58px;margin-top:8px}
.log{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:9px}
.log li{border-top:1px solid var(--line);padding-top:9px;font-size:13px}
.log .meta{font-size:11px;color:var(--ink-3);display:flex;gap:8px;align-items:center}

/* ---------- coach ---------- */
.coach{display:flex;flex-direction:column;gap:9px}
.coach .row{display:flex;gap:7px}
.coach input{flex:1;border:1px solid var(--line);border-radius:8px;background:var(--paper);padding:9px 11px;font-size:13.5px}
.coach input:focus-visible{outline:2px solid var(--accent);outline-offset:-1px}
.sugg{display:flex;gap:6px;flex-wrap:wrap}
.sugg button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 11px;font-size:12px;color:var(--ink-2)}
.answer{background:var(--surface-2);border-radius:8px;padding:11px 13px;font-size:13.5px;line-height:1.55;white-space:pre-wrap}

/* ---------- preference selects ---------- */
.prefs{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.pref{display:flex;flex-direction:column;gap:4px}
.pref select{
  border:1px solid var(--line-2);background:var(--surface);color:var(--ink);
  border-radius:8px;padding:7px 10px;font-size:13px;font-weight:600;min-width:170px;
}
.pref select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.regnote{margin:10px 0 0;font-size:13.5px;color:var(--ink-2);max-width:62ch;font-style:italic}

/* ---------- swaps ---------- */
ul.ings li.swapped .iname{color:var(--jade)}
ul.ings li.swapped .iname em{color:var(--jade)}
.dietflag{border-radius:8px;padding:9px 11px;font-size:13px;margin-top:9px;line-height:1.45}
.dietflag.chili{background:var(--chili-soft);color:var(--chili)}
.dietflag.jade{background:var(--jade-soft);color:var(--jade)}
.dietflag.amber{background:var(--accent-soft);color:var(--accent-ink)}
.swapblock{margin-top:13px;border-top:1px solid var(--line);padding-top:11px}
.swaphead{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:7px}
.swapintro{font-size:13px;color:var(--ink-2);margin:4px 0 8px}
.swapopt{
  display:block;width:100%;text-align:left;border:1px solid var(--line);
  background:var(--surface);border-radius:8px;padding:9px 11px;margin-top:6px;
}
.swapopt:hover{border-color:var(--jade);background:var(--jade-soft)}
.swapopt b{display:block;font-size:13.5px}
.swapopt span{display:block;font-size:12px;color:var(--ink-2);line-height:1.45;margin-top:2px}
.swapnone{font-size:12.5px;color:var(--ink-2);margin:4px 0 0;line-height:1.45}

/* ---------- stores ---------- */
.stores{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-top:13px}
.store{
  border:1px solid var(--line);border-radius:8px;padding:10px 12px;text-decoration:none;
  color:inherit;display:flex;flex-direction:column;gap:3px;background:var(--paper);
}
.store:hover{border-color:var(--accent);background:var(--accent-soft)}
.store b{font-size:13.5px}
.store .tierrow{display:flex;gap:4px;flex-wrap:wrap}
.store .sd{font-size:11.5px;color:var(--ink-2);line-height:1.4}
/* ---------- daily budget ---------- */
.budget{display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin-top:18px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.ring{position:relative;flex:0 0 132px;width:132px;height:132px}
.ringin{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.rbig{font-family:var(--display);font-size:32px;font-weight:600;line-height:1;letter-spacing:-.02em;display:block}
.rlab{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.bstats{flex:1;min-width:210px;display:flex;flex-direction:column;gap:7px}
.brow{display:flex;justify-content:space-between;align-items:center;font-size:13px;gap:10px}
.brow b{font-size:15px}
.brow.dim{color:var(--ink-3);font-size:12px;border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.mtrack{margin-top:3px}
.mtl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-2);margin-bottom:3px}
.sech{font-family:var(--display);font-size:19px;font-weight:600;margin:26px 0 10px}
.daylog{list-style:none;margin:0;padding:0}
.daylog li{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.dl-n{font-size:13.5px;font-weight:600;flex:1;min-width:130px}
.dl-m{font-size:12px;color:var(--ink-2)}
.dim{color:var(--ink-3);font-weight:400}
.pmode{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px}
.pf{display:flex;flex-direction:column;gap:3px}
.pf.wide{grid-column:1/-1}
.pf span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.pf input,.pf select{border:1px solid var(--line-2);background:var(--paper);color:var(--ink);
  border-radius:8px;padding:8px 10px;font-size:13.5px;width:100%}
.pf input:focus-visible,.pf select:focus-visible{outline:2px solid var(--accent);outline-offset:-1px}
.calcout{font-size:12.5px;color:var(--ink-2);margin-top:12px;background:var(--surface-2);
  border-radius:8px;padding:9px 11px;line-height:1.6}
.logrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.logbtns{display:flex;gap:5px}

/* ---------- nutrition ---------- */
.kcal{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;margin-top:10px}
.kbig{font-family:var(--display);font-size:38px;font-weight:600;line-height:1;letter-spacing:-.02em}
.kunit{font-size:13px;font-weight:700;color:var(--ink-2);letter-spacing:.04em;text-transform:uppercase}
.kserves{font-size:12px;color:var(--ink-3);margin-left:auto}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.macro{display:flex;flex-direction:column;gap:1px}
.mlab{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.mval{font-size:15px;font-weight:600}
.mpct{font-size:11.5px;color:var(--ink-2)}
.mbar{display:flex;height:7px;border-radius:4px;overflow:hidden;margin-top:12px;background:var(--sunk)}
.mbar i{display:block;height:100%}
.mbarkey{font-size:11px;color:var(--ink-3);margin-top:5px}
.ntags{display:flex;gap:5px;flex-wrap:wrap;margin-top:12px}
.nnote{font-size:12px;line-height:1.5;margin-top:11px;padding:9px 11px;border-radius:8px;background:var(--surface-2);color:var(--ink-2)}
.nnote strong{color:var(--ink)}
.nnote.warn{background:var(--chili-soft);color:var(--chili)}
.nnote.dim{background:transparent;padding:0;color:var(--ink-3);font-size:11.5px}

.ingshint{font-size:12.5px;color:var(--ink-3);margin:8px 0 0;line-height:1.45}
.ingacts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.tick{
  flex:0 0 auto;width:21px;height:21px;border-radius:5px;border:1.5px solid var(--line-2);
  background:var(--paper);font-size:12px;font-weight:700;line-height:1;padding:0;
  display:grid;place-items:center;color:var(--on-accent);
}
.tick:hover{border-color:var(--accent)}
.tick.on{background:var(--accent);border-color:var(--accent)}
.tick:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
ul.ings li{align-items:center}
ul.ings li.ticked{background:var(--accent-soft);margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:6px}
ul.ings li.ticked + li{border-top-color:transparent}
.stock.have{color:var(--jade)}
.stock.part{color:var(--accent-ink)}
.stock.out{color:var(--chili)}
.stock.unknown{color:var(--ink-3)}

/* ---------- shopping list ---------- */
.shoplist{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.shopitem{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:13px 14px}
.shopitem.hard{border-left:3px solid var(--chili)}
.sihead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.sihead b{font-size:14.5px}
.siqty{font-size:12px;color:var(--ink-2);margin-top:1px}
.sitags{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.whohas{display:flex;flex-direction:column;margin-top:11px;border-top:1px solid var(--line);padding-top:3px}
.who{
  display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  padding:7px 0;text-decoration:none;color:inherit;border-bottom:1px solid var(--line);
}
.who:last-child{border-bottom:0}
.who:hover .wn{color:var(--accent-ink)}
.wn{font-size:13px;font-weight:600}
.wt{display:flex;gap:4px;flex-wrap:wrap}
.nostore{margin-top:13px;border:1px dashed var(--line-2);border-radius:8px;padding:11px 13px;font-size:12.5px;color:var(--ink-2);line-height:1.5}
.nostore strong{color:var(--ink);display:block;margin-bottom:3px}

/* ---------- foundation & layers ---------- */
ul.layers{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column}
ul.layers li{padding:9px 0;border-top:1px solid var(--line);font-size:13px;line-height:1.5}
ul.layers li:first-child{border-top:0}
ul.layers b{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:2px}
ul.layers span{color:var(--ink-2)}

/* ---------- video plan ---------- */
.ytplan{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.ytplan ol{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:7px;font-size:12.5px;color:var(--ink-2);line-height:1.5}
.ytplan ol b{color:var(--ink)}
.ytplan .warn{margin:12px 0 0;font-size:12px;color:var(--ink-2);background:var(--chili-soft);border-radius:8px;padding:9px 11px;line-height:1.5}
.ytplan code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;background:var(--surface-2);padding:1px 4px;border-radius:4px}

/* ---------- pantry ---------- */
table.pantry{width:100%;border-collapse:collapse;font-size:13.5px}
table.pantry th{text-align:left;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);padding:0 8px 8px 0;font-weight:700}
table.pantry td{padding:9px 8px 9px 0;border-top:1px solid var(--line);vertical-align:middle}
table.pantry td:last-child,table.pantry th:last-child{padding-right:0;text-align:right}
.meter{height:5px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:5px;max-width:170px}
.meter i{display:block;height:100%;border-radius:3px;background:var(--jade)}
.meter i.low{background:var(--accent)}
.meter i.out{background:var(--chili)}
.tbl-wrap{overflow-x:auto}
.mini{border:1px solid var(--line-2);background:var(--surface);border-radius:7px;padding:3px 9px;font-size:12px;font-weight:600}

/* ---------- list ---------- */
.lgroup{margin-top:16px}
.lgroup h3{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}
ul.buy{list-style:none;margin:9px 0 0;padding:0}
ul.buy li{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}
ul.buy li span.q{flex:0 0 92px;font-weight:600}

   Passport Pantry — clickable prototype
   Demonstrates four mechanics:
     1. Country -> dish catalog with provenance + attribution slots
     2. Ingredient normalization (native units -> grams) — the hard core
     3. Purchase-anchored pantry ledger with inferred depletion
     4. Cook-and-rate community layer + AI cooking coach
   Recipe method text is original, written for this prototype and NOT
   kitchen-tested. Attribution slots are deliberately empty rather than
   filled with invented sources.
   ======================================================================= */

};

/* ---------- daily budget ----------
   Mifflin-St Jeor for resting metabolic rate, times an activity factor.
   It is the standard clinical estimate and it is still an estimate:
   individual variance runs to roughly 10-15% either way, which is 200-300
   kcal on a typical target. The UI says so, and offers direct entry for
   anyone who already has a figure from a dietitian.                      */
const ACTIVITY = {
  1.2:  'Desk job, little exercise',
  1.375:'Light exercise, 1-3 days a week',
  1.55: 'Moderate exercise, 3-5 days',
  1.725:'Hard exercise, 6-7 days',
  1.9:  'Physical job or twice-daily training'
};
const GOALS = {
  lose_slow:{label:'Lose slowly', delta:-250, note:'About 0.25 kg a week'},
  lose:     {label:'Lose',        delta:-500, note:'About 0.5 kg a week'},
  maintain: {label:'Maintain',    delta:0,    note:'Hold current weight'},
  gain:     {label:'Gain',        delta:350,  note:'About 0.3 kg a week'}
};
/* Widely cited floors below which a deficit needs professional oversight.
   The app will not silently hand someone a 900 kcal target. */
const FLOOR = {male:1500, female:1200, unspecified:1200};
const FRAMEWORKS = {
  balanced:    {label:'Balanced',     p:20, c:50, f:30},
  highprotein: {label:'High protein', p:35, c:35, f:30},
  lowcarb:     {label:'Low carb',     p:30, c:20, f:50},
  keto:        {label:'Keto',         p:20, c:5,  f:75}
};

function bmr(pr){
  const base = 10 * pr.weight + 6.25 * pr.height - 5 * pr.age;
  if(pr.sex === 'male') return base + 5;
  if(pr.sex === 'female') return base - 161;
  return base - 78;                          // midpoint when unspecified
}
function computedTarget(pr){
  const raw = bmr(pr) * pr.activity + GOALS[pr.goal].delta;
  return Math.round(raw / 10) * 10;
}
function targetOf(pr){
  return pr.mode === 'direct' ? pr.target : computedTarget(pr);
}
/* The 1200/1500 figures are floors for a deliberate weight-loss deficit,
   not minimums every body must exceed. A small, sedentary, older person
   can have a genuine maintenance requirement near 1100 — flagging that as
   unsafe, and then suggesting they eat to gain weight, would be wrong and
   would undermine every other warning the app gives. So the floor applies
   only to an intentional deficit, and the suggested remedy never pushes
   anyone upward past maintenance. */
function floorWarning(pr){
  const t = targetOf(pr), f = FLOOR[pr.sex] || 1200;
  if(t >= f) return null;
  const deliberate = pr.mode === 'direct' || GOALS[pr.goal].delta < 0;
  if(!deliberate) return null;                     // maintenance or a surplus is not a crash diet
  if(pr.mode === 'direct') return {target:t, floor:f, fix:null, fixTarget:null, ownNumber:true};
  // Only ease the deficit — never recommend a surplus as the way out.
  const fix = ['lose_slow', 'maintain'].find(g => computedTarget({...pr, goal:g}) >= f) || null;
  const maint = computedTarget({...pr, goal:'maintain'});
  return {target:t, floor:f, fix, fixTarget:fix ? computedTarget({...pr, goal:fix}) : null,
          maintBelowFloor:maint < f, maint};
}
function macroTargets(pr){
  const t = targetOf(pr), fw = FRAMEWORKS[pr.framework];
  return {p:Math.round(t * fw.p / 100 / 4), c:Math.round(t * fw.c / 100 / 4), f:Math.round(t * fw.f / 100 / 9)};
}

const todayKey = () => new Date().toISOString().slice(0, 10);
function dayEntries(){ return state.day[state.date] || []; }
function dayTotals(){
  return dayEntries().reduce((a, e) => ({
    k:a.k + e.k, p:a.p + e.p, c:a.c + e.c, f:a.f + e.f
  }), {k:0, p:0, c:0, f:0});
}
function remainingKcal(){ return targetOf(state.profile) - dayTotals().k; }
/* Does one serving of this dish fit in what is left today? */
function fitsToday(r){
  const left = remainingKcal();
  const k = nutritionOf(r).k;
  if(k <= left) return 'fits';
  if(k <= left + 150) return 'close';
  return 'over';
}

/* ---------- nutrition maths ----------
   Reads through effectiveIngs, so a protein swap changes the numbers.   */
function nutritionOf(r){
  const per = {k:0, p:0, c:0, f:0};
  let missing = 0, adjusted = false;
  effectiveIngs(r).forEach(ing => {
    const n = NUTR[ing.i];
    const g = toGrams(ing.i, ing.q, ing.u);          // one batch, unscaled
    if(!n || g === null){ missing++; return; }
    const eat = (EATEN[r.id] && EATEN[r.id][ing.i] !== undefined) ? EATEN[r.id][ing.i] : 1;
    if(eat !== 1) adjusted = true;
    const mass = g * eat / 100;
    per.k += n.k * mass; per.p += n.p * mass;
    per.c += n.c * mass; per.f += n.f * mass;
  });
  const s = r.serves || 1;                            // per serving is scale-invariant
  const out = {k:per.k / s, p:per.p / s, c:per.c / s, f:per.f / s, missing, adjusted};
  // energy split, from the macros rather than from the kcal figure
  const ek = out.p * 4 + out.c * 4 + out.f * 9;
  out.split = ek > 0
    ? {p:Math.round(out.p * 4 / ek * 100), c:Math.round(out.c * 4 / ek * 100), f:Math.round(out.f * 9 / ek * 100)}
    : {p:0, c:0, f:0};
  /* Tags need an absolute threshold as well as an energy share. Judging
     "low carb" on share alone tags a plate with 54 g of carbohydrate as
     low-carb whenever the fat is high enough to dominate the energy —
     true arithmetic, useless advice, and the kind of thing that makes a
     dieting user stop trusting the app. Both tests must pass. */
  out.tags = [];
  if(out.c <= 10 && out.split.c <= 10) out.tags.push('Keto-friendly');
  else if(out.c <= 30 && out.split.c <= 25) out.tags.push('Low carb');
  if(out.split.p >= 30) out.tags.push('High protein');
  if(out.k <= 450) out.tags.push('Under 450 kcal');
  return out;
}

const metaOf = s => STORE_META[s.n] || {strong:[]};

/* A country's store list is derived from platform coverage plus locals. */
function storesFor(cc){
  const global = Object.values(PLATFORMS).filter(p => p.cc.includes(cc));
  return [...(LOCAL[cc] || []), ...global];
}

/* ---------- who actually has this ingredient ----------
   Not live inventory — no catalogue API exists for most of these stores.
   A ranked sourcing judgement, labelled as one.                         */
function sourcesFor(ingId, cc){
  const oc = ocOf(ingId), keep = keepOf(ingId);
  const native = (NATIVE[cc] || []).includes(oc) || oc === 'universal';
  const out = [];
  storesFor(cc).forEach(s => {
    const m = metaOf(s);
    // Mail order cannot deliver something that has to arrive fresh.
    if(m.ships && keep === 'fresh') return;
    // A delivery platform only carries what the shops behind it carry.
    let conf = null;
    if(native && (m.wide || s.for.includes(ING[ingId].buy))) conf = 'likely';
    else if(m.strong.includes(oc)) conf = 'likely';
    else if(m.wide) conf = 'maybe';
    if(conf) out.push({store:s, conf});
  });
  const rank = {likely:0, maybe:1};
  out.sort((a, b) => rank[a.conf] - rank[b.conf]
    || (a.store.tier === 'cart' ? -1 : 0) - (b.store.tier === 'cart' ? -1 : 0));
  return {list:out.slice(0, 6), native, oc, keep};
}
/* Countries the registry can actually serve — no empty screens. */
const SERVED = Object.keys(COUNTRIES)
  .filter(cc => storesFor(cc).length)
  .sort((a, b) => COUNTRIES[a].n.localeCompare(COUNTRIES[b].n));

/* ---------- unit normalization ---------- */
function toGrams(id, qty, unit){
  const c = ING[id] && ING[id].conv;
  if(!c || c[unit] === undefined) return null;   // undefined, not guessed
  return qty * c[unit];
}
function fmtQty(q){
  if(q >= 100) return String(Math.round(q));
  if(q >= 10)  return String(Math.round(q * 10) / 10);
  return String(Math.round(q * 100) / 100);
}
function fmtG(g){
  if(g === null) return '—';
  if(g >= 1000) return fmtQty(g / 1000) + ' kg';
  return Math.round(g) + ' g';
}
const UNIT_LABEL = {g:'g', ml:'ml', tsp:'tsp', tbsp:'tbsp', cup:'cup', piece:'', clove:'clove', bunch:'bunch'};
function fmtIng(q, u){
  const n = fmtQty(q);
  if(u === 'piece') return n;
  if(u === 'clove') return n + (q === 1 ? ' clove' : ' cloves');
  if(u === 'bunch') return n + (q === 1 ? ' bunch' : ' bunches');
  if(u === 'cup')   return n + (q === 1 ? ' cup' : ' cups');
  return n + ' ' + UNIT_LABEL[u];
}

/* ---------- storage (db capability, degrades cleanly) ---------- */
async function initCaps(){
  try{
    state.db = await window.claude?.use?.('db') ?? null;
  }catch(e){ state.db = null; }
  try{
    state.sample = await window.claude?.use?.('sample') ?? null;
  }catch(e){ state.sample = null; }
  try{
    state.user = await window.claude?.use?.('user') ?? null;
  }catch(e){ state.user = null; }

  /* A food diary and a body-composition profile are personal health data,
     so they go under the viewer's own private path rather than the shared
     collections the pantry and cook log use. Without the user capability
     we keep them in memory for the session instead of writing them
     somewhere other people could read. */
  if(state.db && state.user){
    try{
      const uid = await state.user.id();
      state.privBase = 'data/users/' + uid + '/';
      const prof = await state.db.doc(state.privBase + 'profile').get();
      if(prof) state.profile = {...state.profile, ...prof};
      state.db.collection(state.privBase + 'days').onSnapshot(docs => {
        const next = {};
        (docs || []).forEach(d => { next[d.id] = d.entries || []; });
        state.day = {...state.day, ...next};
        render();
      });
    }catch(e){ state.privBase = null; }
  }

  if(state.db){
    try{
      state.db.collection('pantry').onSnapshot(docs => {
        if(!docs || !docs.length) return;
        const next = {};
        docs.forEach(d => { next[d.id] = {bought:d.bought, left:d.left}; });
        state.pantry = next; state.pantryIsExample = false; render();
      });
      state.db.collection('cooked').orderBy('at','desc').limit(60).onSnapshot(docs => {
        state.cooked = (docs || []).map(d => ({id:d.id, ...d}));
        render();
      });
    }catch(e){ /* subscription unavailable; stay local */ }
  }
  render();
}

/* ---------- diet engine ----------
   effectiveIng() is the single place the swap is applied. Everything
   downstream — quantities, pantry coverage, the shopping list — reads
   through it, so a swap propagates without any of them knowing about
   diets at all.                                                        */
function effectiveIng(recipeId, ing){
  const sw = state.swaps[recipeId] && state.swaps[recipeId][ing.i];
  return sw ? {...ing, i:sw, swappedFrom:ing.i} : ing;
}
function effectiveIngs(r){ return r.ings.map(ing => effectiveIng(r.id, ing)); }

function dietCheck(r){
  const d = DIETS[state.diet];
  const conflicts = [], warnings = [];
  if(!d || (!d.avoid.length && !d.warn.length)) return {conflicts, warnings, ok:true};
  effectiveIngs(r).forEach(ing => {
    const f = flagsOf(ing.i);
    const bad = d.avoid.filter(a => f.includes(a));
    const warn = d.warn.filter(a => f.includes(a));
    if(bad.length) conflicts.push({ing, why:bad});
    else if(warn.length) warnings.push({ing, why:warn});
  });
  return {conflicts, warnings, ok:conflicts.length === 0};
}
/* A dish is rescuable when every conflict has at least one substitution
   that is itself clean under the active diet. */
function cleanSubs(ingId){
  const d = DIETS[state.diet];
  return (SUBS[ingId] || []).filter(s => !flagsOf(s.to).some(f => d.avoid.includes(f)));
}
function dishStatus(r){
  const {conflicts} = dietCheck(r);
  if(!conflicts.length) return 'fits';
  return conflicts.every(c => cleanSubs(c.ing.i).length) ? 'swap' : 'no';
}
function applySwap(recipeId, from, to){
  state.swaps[recipeId] = state.swaps[recipeId] || {};
  state.swaps[recipeId][from] = to;
  render();
}
function clearSwaps(recipeId){ delete state.swaps[recipeId]; render(); }

/* ---------- pantry mechanics ---------- */
function stockOf(id){ return state.pantry[id] ? state.pantry[id].left : 0; }
function needOf(recipe, ing){ return toGrams(ing.i, ing.q * state.servingsMul, ing.u); }
function coverage(recipe, ing){
  const need = needOf(recipe, ing);
  if(need === null) return {cls:'none', label:'not tracked', need:null, have:stockOf(ing.i)};
  const have = stockOf(ing.i);
  if(have <= 0) return {cls:'none', label:'none', need, have};
  if(have >= need) return {cls:'ok', label:fmtG(have) + ' on hand', need, have};
  return {cls:'low', label:'only ' + fmtG(have), need, have};
}
async function logServing(r, servings){
  const n = nutritionOf(r);
  const e = {id:'e' + Date.now(), dishId:r.id, dish:r.dish, servings,
             k:n.k * servings, p:n.p * servings, c:n.c * servings, f:n.f * servings, at:Date.now()};
  state.day[state.date] = [...dayEntries(), e];
  render();
  saveDay();
}
function unlog(id){
  state.day[state.date] = dayEntries().filter(e => e.id !== id);
  render();
  saveDay();
}
async function cookDish(recipe, rating, note){
  // Purchase-anchored depletion: subtract what the recipe consumed, floor at 0.
  effectiveIngs(recipe).forEach(ing => {
    const need = needOf(recipe, ing);
    if(need === null) return;
    const p = state.pantry[ing.i];
    if(!p) return;
    p.left = Math.max(0, p.left - need);
  });
  state.pantryIsExample = false;
  logServing(recipe, 1);
  const entry = {dishId:recipe.id, rating, note:note || '', at:Date.now()};
  state.cooked = [{id:'local-' + Date.now(), ...entry}, ...state.cooked];
  render();
  if(state.db){
    try{ await state.db.collection('cooked').add(entry); }catch(e){}
    await flushWholePantry();
  }
}

/* ---------- shopping list ----------
   Driven by what the cook ticked, ingredient by ingredient, rather than
   by whole dishes. state.need maps an ingredient to how much is wanted
   and which dishes asked for it.                                        */
function shortfallOf(r, ing){
  const need = needOf(r, ing);
  if(need === null) return null;                 // unconvertible: cannot do the maths
  return Math.max(0, need - stockOf(ing.i));
}
function isNeeded(id){ return Object.prototype.hasOwnProperty.call(state.need, id); }
function toggleNeed(r, ing){
  const id = ing.i;
  if(isNeeded(id)){ delete state.need[id]; render(); return; }
  const g = shortfallOf(r, ing);
  const nat = needOf(r, ing);
  state.need[id] = {
    g: g === null ? null : (g > 0 ? g : nat),      // if stocked, buying still means the full amount
    unit: g === null ? fmtIng(ing.q * state.servingsMul, ing.u) : null,
    dishes:[r.id]
  };
  render();
}
function needAllShort(r){
  effectiveIngs(r).forEach(ing => {
    const s = shortfallOf(r, ing);
    if(s === null || s > 0){
      if(!isNeeded(ing.i)) state.need[ing.i] = {
        g: s === null ? null : s,
        unit: s === null ? fmtIng(ing.q * state.servingsMul, ing.u) : null,
        dishes:[r.id]
      };
    }
  });
  render();
}
function clearNeed(){ state.need = {}; render(); }
function buildList(){
  return Object.keys(state.need)
    .map(id => ({id, ...state.need[id], buy:ING[id].buy, oc:ocOf(id)}))
    .sort((a, b) => {
      const order = {spec:0, fresh:1, staple:2};
      return order[a.buy] - order[b.buy] || ING[a.id].n.localeCompare(ING[b.id].n);
    });
}

          <span class="pill plain num">${Math.round(nutritionOf(r).k)} kcal</span>
          ${state.diet !== 'none' ? (
            st === 'fits' ? `<span class="pill jade">✓ ${esc(d.label)}</span>` :
            st === 'swap' ? `<span class="pill amber">Needs a swap</span>` :
                            `<span class="pill chili">Doesn't fit</span>`) : ''}
          ${rat.n ? `<span class="pill jade">★ ${rat.avg.toFixed(1)} · ${rat.n} cooked</span>` : `<span class="pill amber">Draft · untested</span>`}
        </div>
      </button>`;
    }).join('')}
  </div>`;
}

function ratingFor(dishId){
  const rs = state.cooked.filter(c => c.dishId === dishId && c.rating > 0);
  if(!rs.length) return {n:0, avg:0};
  return {n:rs.length, avg:rs.reduce((a, b) => a + b.rating, 0) / rs.length};
}

function viewRecipe(){
  const r = byId(state.dishId);
  if(!r) return viewAtlas();
  const rat = ratingFor(r.id);
  const craft = CRAFT[r.id];
  const logs = state.cooked.filter(c => c.dishId === r.id).slice(0, 8);
  const ytQuery = `${r.dish} ${r.native} recipe`;

  const diet = dietCheck(r);
  // The protein is the first meat or fish in the recipe; its alternatives

  const proteinIng = effectiveIngs(r).find(ing => flagsOf(ing.i).some(f => f === 'meat' || f === 'fish'));

  return `

  <div class="cols">
    <div>

        <p class="ingshint">Your pantry is checked against every line. Tick what you need and it goes to Shopping, where the app works out who is likely to have it.</p>
        <ul class="ings">
          ${effectiveIngs(r).map(ing => {
            const cov = coverage(r, ing);
            const g = needOf(r, ing);
            const short = shortfallOf(r, ing);

            const state_ = short === null ? 'unknown' : short > 0 ? (cov.have > 0 ? 'part' : 'out') : 'have';
            const label = {

            }[state_];
            return `<li class="${ing.swappedFrom ? 'swapped ' : ''}${ticked ? 'ticked' : ''}">
              <button class="tick ${ticked ? 'on' : ''}" data-need="${ing.i}" aria-pressed="${ticked}"
                      aria-label="${ticked ? 'Remove' : 'Add'} ${esc(ING[ing.i].n)} ${ticked ? 'from' : 'to'} shopping list">${ticked ? '✓' : ''}</button>
              <span class="qty num">${fmtIng(ing.q * state.servingsMul, ing.u)}</span>
              <span class="iname">${esc(ING[ing.i].n)}<em>${ing.swappedFrom ? 'swapped from ' + esc(ING[ing.swappedFrom].n) + ' · ' : ''}${g === null ? 'no gram conversion defined' : '≈ ' + fmtG(g)}</em></span>
              <span class="stock ${state_}">${esc(label)}${short > 0 && cov.have > 0 ? ` · short ${fmtG(short)}` : ''}</span>
            </li>`;

          ${Object.keys(state.swaps[r.id] || {}).length ? `<button class="mini" id="clearswaps">Undo swaps</button>` : ''}
        </div>
      </div>

      ${diet.conflicts.length || diet.warnings.length || proteinOpts.length ? `
      <div class="panel">
        <h2>Protein &amp; diet</h2>
        ${diet.conflicts.length ? `
          <div class="dietflag chili">
            <strong>${esc(DIETS[state.diet].label)}:</strong> ${diet.conflicts.length} ingredient${diet.conflicts.length > 1 ? 's' : ''} to change.
          </div>
          ${diet.conflicts.map(c => `
            <div class="swapblock">
              <div class="swaphead">${esc(ING[c.ing.i].n)} <span class="pill chili">${c.why.map(esc).join(', ')}</span></div>
              ${cleanSubs(c.ing.i).length
                ? cleanSubs(c.ing.i).map(s => `<button class="swapopt" data-swapfrom="${c.ing.i}" data-swapto="${s.to}">
                     <b>${esc(ING[s.to].n)}</b><span>${esc(s.note)}</span></button>`).join('')
                : `<p class="swapnone">No substitution in the table fits this profile. This dish is built around the ingredient — better to choose another.</p>`}
            </div>`).join('')}
        ` : state.diet !== 'none' ? `<div class="dietflag jade"><strong>${esc(DIETS[state.diet].label)}:</strong> no conflicts in this recipe.</div>` : ''}

        ${diet.warnings.map(w => `<div class="dietflag amber"><strong>Check:</strong> ${esc(ING[w.ing.i].n)} — ${esc(w.why.join(', ').replace('alcohol_derived','made from wine; fermentation transforms it, and practice varies').replace('dairy','served alongside meat in this dish'))}.</div>`).join('')}

        ${proteinOpts.length ? `
          <div class="eyebrow" style="margin-top:14px">Change the protein</div>
          <p class="swapintro">${esc(ING[proteinId].n)} is a layer, not the foundation. These all work:</p>
          ${proteinOpts.map(s => `<button class="swapopt" data-swapfrom="${proteinId}" data-swapto="${s.to}">
             <b>${esc(ING[s.to].n)}</b><span>${esc(s.note)}</span></button>`).join('')}

      <div class="panel">
        <h2>Per serving</h2>
        <div class="kcal">
          <span class="kbig num">${Math.round(nut.k)}</span><span class="kunit">kcal</span>
          <span class="kserves">of ${r.serves} servings${state.servingsMul !== 1 ? ` · unchanged by scaling` : ''}</span>
        </div>
        <div class="macros">
          ${[['Protein','p',nut.p,'var(--jade)'],['Carbs','c',nut.c,'var(--accent)'],['Fat','f',nut.f,'var(--chili)']].map(([lab,k,v,col]) => `
            <div class="macro">
              <span class="mlab">${lab}</span>
              <span class="mval num">${v.toFixed(1)} g</span>
              <span class="mpct num">${nut.split[k]}%</span>
            </div>`).join('')}
        </div>
        <div class="mbar" role="img" aria-label="Energy split: ${nut.split.p}% protein, ${nut.split.c}% carbohydrate, ${nut.split.f}% fat">
          <i style="width:${nut.split.p}%;background:var(--jade)"></i>
          <i style="width:${nut.split.c}%;background:var(--accent)"></i>
          <i style="width:${nut.split.f}%;background:var(--chili)"></i>
        </div>
        <div class="mbarkey">Share of energy — protein, carbohydrate, fat</div>
        ${nut.tags.length ? `<div class="ntags">${nut.tags.map(t => `<span class="pill jade">${esc(t)}</span>`).join('')}</div>` : ''}
        <div class="logrow">
          <span class="eyebrow">Log a serving</span>
          <div class="logbtns">
            ${[0.5, 1, 1.5, 2].map(x => `<button class="mini" data-log="${x}">${x === 1 ? '1' : x}×</button>`).join('')}
          </div>
        </div>
        <div class="nnote dim" style="margin-top:6px">${Math.round(remainingKcal())} kcal left today — ${fitsToday(r) === 'fits' ? 'a serving fits' : fitsToday(r) === 'close' ? 'a serving is just over' : 'a full serving is over budget'}.</div>

        ${nut.adjusted ? `<div class="nnote"><strong>Adjusted for what you don't eat.</strong> ${esc(EATEN_NOTE[r.id] || '')}</div>` : ''}
        ${nut.missing ? `<div class="nnote warn">${nut.missing} ingredient${nut.missing > 1 ? 's' : ''} could not be counted — no nutrition row or no gram conversion. The figure above is low by that much.</div>` : ''}
        <div class="nnote dim">Reference approximations, not sourced values. Production resolves every ingredient against USDA FoodData Central, which is public domain with a free key. Carbohydrate is total, not net — fibre is not tracked yet. Informational, not medical or dietary advice.</div>
      </div>

      <div class="panel">
        <h2>The foundation</h2>
        <p style="font-size:13.5px;color:var(--ink-2);margin:6px 0 0;line-height:1.55">${esc(craft.foundation)}</p>
        <div class="eyebrow" style="margin-top:16px">What people change</div>
        <ul class="layers">
          ${craft.layers.map(l => `<li><b>${esc(l.w)}</b><span>${esc(l.o)}</span></li>`).join('')}
        </ul>
      </div>

      <div class="panel">
        <h2>Source</h2>
        <div class="attrib" style="margin-top:8px">
          <strong>No source attached.</strong> The foundation and method above were written for this prototype and have not been kitchen-tested. In production this slot carries the original author, a link back, and the date someone who actually cooked it signed off.
        </div>
      </div>

      <div class="panel">
        <h2>I cooked this</h2>
        <p style="font-size:13px;color:var(--ink-2);margin:4px 0 0">Logging a cook subtracts these ingredients from your pantry.</p>
        <div class="stars" id="stars" role="group" aria-label="Rating">
          ${[1,2,3,4,5].map(i => `<button data-star="${i}" data-on="0" aria-label="${i} star${i > 1 ? 's' : ''}">★</button>`).join('')}
        </div>
        <textarea class="note" id="note" placeholder="What you'd change next time — substitutions, heat, timing…"></textarea>
        <button class="btn primary" id="cook" style="margin-top:9px">Log this cook</button>
        ${logs.length ? `<ul class="log">${logs.map(c => `<li>
          <div class="meta"><span style="color:var(--accent)">${'★'.repeat(c.rating || 0)}</span><span>${new Date(c.at).toLocaleDateString()}</span></div>
          ${c.note ? `<div>${esc(c.note)}</div>` : '<div style="color:var(--ink-3)">No note</div>'}
        </li>`).join('')}</ul>` : ''}
      </div>
    </div>

    <div>
      <div class="panel">
        <h2>Method</h2>
        <ol class="steps">
          ${r.steps.map(s => `<li><div><b>${esc(s.h)}</b>${esc(s.t)}${s.heat ? `<div class="heat">🔥 ${esc(s.heat)}</div>` : ''}</div></li>`).join('')}

        <div class="coach">
          <div class="sugg">
            <button data-ask="My dough is too sticky to pleat. What now?">Dough too sticky</button>
            <button data-ask="I can't find one of these ingredients. What can I substitute without ruining it?">Substitutions</button>
            <button data-ask="What's the most common way people get this dish wrong?">Common mistakes</button>
            <button data-ask="What should this look and smell like when it's done?">Doneness cues</button>
          </div>
          <div class="row">
            <input id="ask" placeholder="Ask anything about cooking this…" autocomplete="off">
            <button class="btn primary" id="asksend">Ask</button>
          </div>
          <div id="answer" class="answer" ${state.coachAnswer ? '' : 'hidden'}>${esc(state.coachAnswer)}</div>
          <div id="coachoff" class="notice" ${state.sample ? 'hidden' : ''}>The coach needs the published page and your approval to reach Claude. It is unavailable in this view.</div>
        </div>
      </div>

      <div class="panel">
        <h2>Watch it made</h2>
        <p style="font-size:13px;color:var(--ink-2);margin:4px 0 12px">Seeing the dough come together beats reading about it. Cooks who watched a version first report better results than cooks who only read.</p>
        <a class="btn primary" href="${ytUrl}" target="_blank" rel="noopener noreferrer" style="display:inline-block;text-decoration:none">Search YouTube for ${esc(r.dish)} →</a>
        <div class="ytplan">
          <div class="eyebrow">What the built version does instead</div>
          <ol>
            <li><b>Finds real videos</b> through the YouTube Data API — title, channel, thumbnail, view count, publish date. Sanctioned, free, quota-limited.</li>
            <li><b>Plays them in the official embed</b>, so the creator keeps the view and the ad revenue. This is explicitly permitted and it is why the relationship stays friendly.</li>
            <li><b>Reads the description</b>, which is where most cooking channels put their full ingredient list, and parses it into the structured format this page uses.</li>
            <li><b>Tags each one against the foundation above</b> — "this cook uses lamb, pleats 24, skips the fenugreek" — so you can compare approaches instead of picking one at random.</li>
          </ol>
          <p class="warn">Not doing: pulling transcripts. <code>captions.download</code> only works on videos you own, and the workaround libraries that scrape the internal endpoint violate YouTube's developer policies. Description text and metadata are the legitimate surface.</p>
        </div>
      </div>
    </div>
  </div>`;
}

function viewPantry(){
  const ids = Object.keys(state.pantry).sort((a, b) => ING[a].n.localeCompare(ING[b].n));
  return `
  <div class="eyebrow">Inferred from what you bought and what you cooked</div>
  <h1 class="title" style="margin:6px 0 10px">Pantry</h1>
  <p class="lede">These are estimates, not measurements. The app anchors on the size you purchased and subtracts what each logged cook used. Correct any line and the estimate resets from there.</p>
  ${state.pantryIsExample ? `<div class="notice" style="margin-top:14px">⚠︎ Showing <strong>example stock</strong> so the screen is not empty. It is replaced the first time you log a cook or edit a quantity.</div>` : ''}
  <div class="panel" style="margin-top:16px">
    <div class="tbl-wrap">
      <table class="pantry">
        <thead><tr><th>Ingredient</th><th>Bought</th><th>Estimated left</th><th></th></tr></thead>
        <tbody>
        ${ids.map(id => {
          const p = state.pantry[id];
          const pct = p.bought > 0 ? Math.max(0, Math.min(100, (p.left / p.bought) * 100)) : 0;
          const cls = pct <= 0 ? 'out' : pct < 25 ? 'low' : '';
          return `<tr>
            <td><strong>${esc(ING[id].n)}</strong><div style="font-size:11px;color:var(--ink-3)">${ING[id].buy === 'spec' ? 'specialty market' : ING[id].buy === 'fresh' ? 'fresh · grocery' : 'shelf stable'}</div></td>
            <td class="num">${fmtG(p.bought)}</td>
            <td class="num">${fmtG(p.left)}<div class="meter"><i class="${cls}" style="width:${pct}%"></i></div></td>
            <td><button class="mini" data-refill="${id}">Refill</button></td>
          </tr>`;
        }).join('')}
        </tbody>
      </table>
    </div>
  </div>
  <div class="notice" style="margin-top:14px"><strong>Known gap.</strong> Ingredients with no gram conversion (a "bunch" of thyme, a "pinch") cannot be tracked here. That conversion table is the single hardest piece of engineering in this product and it is only partly filled in.</div>`;
}

function viewToday(){
  const pr = state.profile;
  const target = targetOf(pr), tot = dayTotals(), left = remainingKcal();
  const mt = macroTargets(pr), warn = floorWarning(pr);
  const pct = target > 0 ? Math.min(100, tot.k / target * 100) : 0;
  const over = tot.k > target;
  const C = 2 * Math.PI * 54;
  const fitting = R.map(r => ({r, n:nutritionOf(r), fit:fitsToday(r)}))
                   .filter(x => x.fit !== 'over')
                   .sort((a, b) => b.n.k - a.n.k);

  return `
  <div class="eyebrow">${new Date(state.date + 'T12:00:00').toLocaleDateString(undefined,{weekday:'long', day:'numeric', month:'long'})}</div>

        <circle cx="60" cy="60" r="54" fill="none" stroke="var(--sunk)" stroke-width="11"/>
        <circle cx="60" cy="60" r="54" fill="none" stroke="${over ? 'var(--chili)' : 'var(--jade)'}"
                stroke-width="11" stroke-linecap="round" transform="rotate(-90 60 60)"
                stroke-dasharray="${(C * pct / 100).toFixed(1)} ${C.toFixed(1)}"/>
      </svg>
      <div class="ringin">
        <span class="rbig num">${Math.abs(Math.round(left))}</span>
        <span class="rlab">${left < 0 ? 'kcal over' : 'kcal left'}</span>

    <div class="bstats">
      <div class="brow"><span>Eaten</span><b class="num">${Math.round(tot.k)}</b></div>
      <div class="brow"><span>Target</span><b class="num">${target}</b></div>
      <div class="brow dim"><span>${pr.mode === 'calc' ? GOALS[pr.goal].label + ' · ' + FRAMEWORKS[pr.framework].label : 'Set directly · ' + FRAMEWORKS[pr.framework].label}</span><button class="mini" id="editprof">${state.editProfile ? 'Close' : 'Adjust'}</button></div>
      ${[['Protein','p',tot.p,mt.p,'var(--jade)'],['Carbs','c',tot.c,mt.c,'var(--accent)'],['Fat','f',tot.f,mt.f,'var(--chili)']].map(([lab,k,v,t,col]) => `
        <div class="mtrack">
          <div class="mtl"><span>${lab}</span><span class="num">${Math.round(v)} / ${t} g</span></div>
          <div class="meter"><i style="width:${t > 0 ? Math.min(100, v / t * 100) : 0}%;background:${col}"></i></div>
        </div>`).join('')}
    </div>
  </div>

  ${warn ? `<div class="notice" style="margin-top:14px;border-color:var(--chili);color:var(--chili)">
    <strong>That deficit works out to ${warn.target} kcal, below the ${warn.floor} kcal mark.</strong>
    Sustained intake this low while trying to lose weight is generally held to need professional supervision, and the dishes below are filtered against it, so you would see very little.
    ${warn.ownNumber
      ? ' If a dietitian set this figure, carry on — the app is only noting where it sits.'
      : warn.fix
        ? ` Switching the goal to <strong>${esc(GOALS[warn.fix].label)}</strong> gives ${warn.fixTarget} kcal.`
        : ` Your estimated maintenance is already about ${warn.maint} kcal, so there is not much room for a deficit at all. This is worth discussing with a dietitian rather than solving with a slider.`}
  </div>` : ''}

  ${state.editProfile ? `
  <div class="panel" style="margin-top:14px">
    <h2>Your target</h2>
    <div class="pmode">
      <button class="chip" data-pmode="calc" aria-pressed="${pr.mode === 'calc'}">Estimate it for me</button>
      <button class="chip" data-pmode="direct" aria-pressed="${pr.mode === 'direct'}">I know my number</button>
    </div>
    ${pr.mode === 'direct' ? `
      <div class="pgrid" style="margin-top:12px">
        <label class="pf"><span>Daily calories</span><input type="number" id="pf-target" value="${pr.target}" min="800" max="6000" step="10"></label>
      </div>
    ` : `
      <div class="pgrid" style="margin-top:12px">
        <label class="pf"><span>Sex</span><select id="pf-sex">
          ${['unspecified','female','male'].map(v => `<option value="${v}" ${pr.sex === v ? 'selected' : ''}>${v === 'unspecified' ? 'Prefer not to say' : v[0].toUpperCase() + v.slice(1)}</option>`).join('')}
        </select></label>
        <label class="pf"><span>Age</span><input type="number" id="pf-age" value="${pr.age}" min="14" max="100"></label>
        <label class="pf"><span>Height (cm)</span><input type="number" id="pf-height" value="${pr.height}" min="120" max="230"></label>
        <label class="pf"><span>Weight (kg)</span><input type="number" id="pf-weight" value="${pr.weight}" min="30" max="300"></label>

          ${Object.keys(ACTIVITY).map(v => `<option value="${v}" ${String(pr.activity) === v ? 'selected' : ''}>${esc(ACTIVITY[v])}</option>`).join('')}
        </select></label>

  </div>` : ''}

  <h2 class="sech">Logged today</h2>
  ${dayEntries().length ? `<ul class="daylog">
    ${dayEntries().map(e => `<li>
      <span class="dl-n">${esc(e.dish)}${e.servings !== 1 ? ` <span class="dim">× ${e.servings}</span>` : ''}</span>
      <span class="dl-m num">${Math.round(e.k)} kcal · P${Math.round(e.p)} C${Math.round(e.c)} F${Math.round(e.f)}</span>
      <button class="mini" data-unlog="${e.id}">Remove</button>
    </li>`).join('')}
  </ul>` : `<div class="empty">Nothing logged. Open a dish and log a serving, or use the list below.</div>`}

  <h2 class="sech">${left < 0 ? 'You are over for today' : `What fits in ${Math.round(left)} kcal`}</h2>
  ${left < 0
    ? `<div class="empty">One day over target is not a problem; a pattern of them is. Tomorrow resets.</div>`
    : fitting.length
      ? `<div class="grid">
          ${fitting.map(x => `<button class="dish" data-dish="${x.r.id}">
            <div class="where"><span aria-hidden="true">${x.r.flag}</span>${esc(x.r.country)}</div>
            <h3>${esc(x.r.dish)}</h3>
            <div class="foot">
              <span class="pill ${x.fit === 'fits' ? 'jade' : 'amber'} num">${Math.round(x.n.k)} kcal${x.fit === 'close' ? ' · just over' : ''}</span>
              <span class="pill plain num">P${Math.round(x.n.p)} C${Math.round(x.n.c)} F${Math.round(x.n.f)}</span>
            </div>
          </button>`).join('')}
        </div>`
      : `<div class="empty">Nothing in the catalogue fits what is left. A smaller portion of something will — the servings control on any dish scales it.</div>`}

  <div class="notice" style="margin-top:20px"><strong>Built on approximate nutrition data.</strong> The ingredient values behind these figures are reference approximations, not USDA-sourced, so a day's total carries that error compounded across everything you logged. Useful for direction and habit; not accurate enough to manage a medical condition on. Informational only, not dietary or medical advice.</div>`;
}

function viewList(){
  const rows = buildList();
  const mkt = COUNTRIES[state.market];
  const CONF = {likely:{l:'Usually stocks it', c:'jade'}, maybe:{l:'Worth checking', c:'amber'}};

  return `
  <div class="eyebrow">What you ticked, and who is likely to have it</div>
  <h1 class="title" style="margin:6px 0 10px">Shopping</h1>
  <div class="prefs" style="margin-bottom:6px">
    <label class="pref">
      <span class="eyebrow">Shopping from</span>
      <select id="marketsel">
        ${SERVED.map(k => `<option value="${k}" ${state.market === k ? 'selected' : ''}>${COUNTRIES[k].f} ${esc(COUNTRIES[k].n)}</option>`).join('')}
      </select>
    </label>
  </div>

  ${!rows.length ? `<div class="empty">
      Nothing on the list yet. Open a dish, and tick the ingredients you need — the pantry is checked against every line for you.
    </div>` : `
    <p class="lede" style="margin-bottom:4px">${rows.length} ingredient${rows.length > 1 ? 's' : ''} for ${esc(mkt.n)}. Hardest to find first.</p>
    <div class="shoplist">
      ${rows.map(row => {
        const src = sourcesFor(row.id, state.market);
        const hard = !src.native && row.buy === 'spec';
        return `<div class="shopitem ${hard ? 'hard' : ''}">
          <div class="sihead">
            <div>
              <b>${esc(ING[row.id].n)}</b>
              <div class="siqty num">${row.g === null ? esc(row.unit) + ' · no gram conversion' : fmtG(row.g)}</div>
            </div>
            <div class="sitags">
              ${src.native
                ? `<span class="pill jade">Everyday here</span>`
                : `<span class="pill ${row.buy === 'spec' ? 'chili' : 'amber'}">${esc(OC_LABEL[src.oc])}</span>`}
              ${src.keep === 'fresh' ? `<span class="pill plain">must be fresh</span>` : ''}
              <button class="mini" data-unneed="${row.id}">Remove</button>
            </div>
          </div>
          ${src.list.length ? `<div class="whohas">
            ${src.list.map(x => `
              <a class="who" href="https://duckduckgo.com/?q=${encodeURIComponent(x.store.n + ' ' + mkt.n + ' ' + ING[row.id].n)}" target="_blank" rel="noopener noreferrer">
                <span class="wn">${esc(x.store.n)}</span>
                <span class="wt"><span class="pill ${CONF[x.conf].c}">${CONF[x.conf].l}</span><span class="pill ${TIERS[x.store.tier].cls}">${esc(TIERS[x.store.tier].label)}</span></span>
              </a>`).join('')}
          </div>` : `<div class="nostore">
            <strong>Nothing in ${esc(mkt.n)} reliably carries this.</strong>
            ${src.keep === 'fresh'
              ? 'It has to arrive fresh, so mail order is out. Look for a grower, a diaspora grocer, or substitute — the recipe page lists what works and what it costs you.'
              : 'Try a diaspora grocer, or mail-order from a specialist abroad. Shelf-stable means shipping is at least possible.'}
          </div>`}
        </div>`;
      }).join('')}
    </div>
    <div class="ingacts" style="margin-top:16px"><button class="mini" id="clearneed">Clear the list</button></div>
  `}

  <div class="notice" style="margin-top:20px"><strong>These are sourcing judgements, not live stock.</strong> No catalogue API exists for most of these stores, so the app reasons from what each one reliably carries rather than pretending to know today's shelves. Where a real API exists — Instacart, Kroger, a Salla merchant — the same field gets replaced by actual availability.</div>
  <div class="notice" style="margin-top:10px"><strong>Difficulty is relative to where you are.</strong> Fish sauce is a specialty import in Warsaw and a shelf staple in Hanoi. Switch the country above and watch the same ingredient change from <em>Everyday here</em> to a channel you have to go hunting for. That is why a single global "specialty" label would be wrong.</div>`;
}

function render(){
  el.innerHTML =
    state.view === 'atlas'  ? (state.dishId ? viewRecipe() : viewAtlas()) :
    state.view === 'today'  ? viewToday() :
    state.view === 'pantry' ? viewPantry() :
                              viewList();
  document.querySelectorAll('#tabs button').forEach(b =>
    b.setAttribute('aria-selected', String(b.dataset.view === state.view)));
  el.querySelector('#answer') && restoreStars();
  window.scrollTo({top:0});
}
let pendingStars = 0;
function restoreStars(){
  el.querySelectorAll('#stars button').forEach(b =>
    b.dataset.on = Number(b.dataset.star) <= pendingStars ? '1' : '0');
}

/* ---------- events ---------- */
document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-view]'); if(!b) return;
  state.view = b.dataset.view;
  if(state.view === 'atlas') state.dishId = null;
  render();
});

el.addEventListener('click', async e => {
  const t = e.target;

  const chip = t.closest('[data-filter]');
  if(chip){ state.filter = chip.dataset.filter; render(); return; }

  const rg = t.closest('[data-region]');
  if(rg){ state.regionFilter = rg.dataset.region; state.filter = 'all'; render(); return; }

  const sw = t.closest('[data-swapto]');
  if(sw){ applySwap(state.dishId, sw.dataset.swapfrom, sw.dataset.swapto); return; }

  if(t.id === 'clearswaps'){ clearSwaps(state.dishId); return; }

  const dish = t.closest('[data-dish]');
  if(dish){ state.dishId = dish.dataset.dish; state.servingsMul = 1; state.coachAnswer = ''; pendingStars = 0; render(); return; }

  if(t.id === 'back'){ state.dishId = null; render(); return; }
  if(t.id === 'mup'){ state.servingsMul = Math.min(4, state.servingsMul + 0.5); render(); return; }
  if(t.id === 'mdown'){ state.servingsMul = Math.max(0.5, state.servingsMul - 0.5); render(); return; }

  const tick = t.closest('[data-need]');
  if(tick){
    const r = byId(state.dishId);
    const ing = effectiveIngs(r).find(i => i.i === tick.dataset.need);
    if(ing) toggleNeed(r, ing);
    return;
  }
  if(t.id === 'needall'){ needAllShort(byId(state.dishId)); return; }
  if(t.id === 'goshop'){ state.view = 'list'; state.dishId = null; render(); return; }
  if(t.id === 'clearneed'){ clearNeed(); return; }

  const lg = t.closest('[data-log]');
  if(lg){ logServing(byId(state.dishId), Number(lg.dataset.log)); return; }

  const ul = t.closest('[data-unlog]');
  if(ul){ unlog(ul.dataset.unlog); return; }

  if(t.id === 'editprof'){ state.editProfile = !state.editProfile; render(); return; }

  const pm = t.closest('[data-pmode]');
  if(pm){ state.profile.mode = pm.dataset.pmode; render(); saveProfile(); return; }

  const un = t.closest('[data-unneed]');
  if(un){ delete state.need[un.dataset.unneed]; render(); return; }

  const star = t.closest('[data-star]');
  if(star){ pendingStars = Number(star.dataset.star); restoreStars(); return; }

  if(t.id === 'cook'){
    const r = byId(state.dishId);
    const note = (el.querySelector('#note') || {}).value || '';
    const rating = pendingStars;
    pendingStars = 0;
    await cookDish(r, rating, note);
    return;
  }

  const refill = t.closest('[data-refill]');
  if(refill){
    const id = refill.dataset.refill;
    const p = state.pantry[id];
    p.left = p.bought;
    state.pantryIsExample = false;
    render();
    savePantryItem(id);
    return;
  }

  const ask = t.closest('[data-ask]');
  if(ask){ runCoach(ask.dataset.ask); return; }
  if(t.id === 'asksend'){
    const inp = el.querySelector('#ask');
    if(inp && inp.value.trim()) runCoach(inp.value.trim());
    return;
  }
});

const PF = {
  'pf-target':['target','int'], 'pf-age':['age','int'], 'pf-height':['height','int'],
  'pf-weight':['weight','num'], 'pf-activity':['activity','num'],
  'pf-sex':['sex','str'], 'pf-goal':['goal','str'], 'pf-framework':['framework','str']
};
el.addEventListener('change', e => {
  if(e.target.id === 'dietsel'){ state.diet = e.target.value; render(); return; }
  if(e.target.id === 'marketsel'){ state.market = e.target.value; render(); return; }
  const f = PF[e.target.id];
  if(f){
    const [key, kind] = f;
    const raw = e.target.value;
    state.profile[key] = kind === 'str' ? raw : kind === 'int' ? parseInt(raw, 10) || 0 : parseFloat(raw) || 0;
    render(); saveProfile();
  }
});

el.addEventListener('keydown', e => {
  if(e.target.id === 'ask' && e.key === 'Enter'){
    e.preventDefault();
    if(e.target.value.trim()) runCoach(e.target.value.trim());
  }
});

/* ---------- coach ---------- */
async function runCoach(question){
  const r = byId(state.dishId); if(!r) return;
  const box = el.querySelector('#answer');
  const off = el.querySelector('#coachoff');
  if(!state.sample){ if(off) off.hidden = false; return; }
  if(state.coachBusy) return;
  state.coachBusy = true;
  if(box){ box.hidden = false; box.textContent = 'Thinking…'; }

  const pantryLine = r.ings.map(ing => {
    const cov = coverage(r, ing);
    return `${ING[ing.i].n}: needs ${fmtG(needOf(r, ing))}, pantry has ${fmtG(cov.have)}`;
  }).join('\n');

  const prompt =
`You are a cooking coach helping someone make ${r.dish} (${r.native}) from ${r.country} — ${r.region}.
They are cooking for ${r.serves * state.servingsMul} people.

The method they are following:
${r.steps.map((s, i) => `${i + 1}. ${s.h}: ${s.t}${s.heat ? ' [' + s.heat + ']' : ''}`).join('\n')}

Their pantry against this recipe:
${pantryLine}

Their question: ${question}

Answer in under 140 words. Be specific about temperatures, times and visual cues. If they are missing something, say what actually substitutes and what that costs in flavour. Do not restate the whole recipe. No preamble.`;

  try{
    await state.sample(prompt, {
      modelTier:'default',
      onText:({text}) => { state.coachAnswer = text; if(box) box.textContent = text; }
    });
  }catch(err){
    const msg = err && err.code === 'not_granted'
      ? 'The coach needs your approval to reach Claude. Reload and allow it to try again.'
      : 'The coach could not answer just now. Try again in a moment.';
    state.coachAnswer = msg;
    if(box) box.textContent = msg;
  }
  state.coachBusy = false;
}

render();
initCaps();
</script>
